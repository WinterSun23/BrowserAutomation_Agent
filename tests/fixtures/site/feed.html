<!doctype html><html><head><meta charset="utf-8"><title>Feed</title><script src="shop.js"></script></head>
<body><main aria-label="Feed">
<h1>Latest posts</h1>
<ul id="posts" aria-label="Posts"></ul>
<a id="older" href="feed.html?seed=2">Older posts</a>
</main>
<script>
// The same URL shows different content per ?seed= (like a feed or search results): three posts whose buttons
// have different names each time, then a link to the next seed (1 -> 2 -> 3 -> 1).
const seed = parseInt(new URLSearchParams(location.search).get('seed') || '1', 10);
const TOPICS = ['cats', 'trains', 'tea', 'rivers', 'chess', 'jazz', 'maps', 'bread', 'kites'];
const VERBS = ['Like', 'Share', 'Save'];
const ul = document.getElementById('posts');
for (let i = 0; i < 3; i++) {
  const li = document.createElement('li');
  li.innerHTML = `<b>${TOPICS[(seed * 3 + i) % TOPICS.length]}</b>`;
  for (let j = 0; j <= i; j++) {
    const b = document.createElement('button');
    b.textContent = VERBS[j] + ' ' + TOPICS[(seed * 3 + i) % TOPICS.length];
    li.appendChild(b);
  }
  ul.appendChild(li);
}
const older = document.getElementById('older');
older.href = 'feed.html?seed=' + (seed % 3 + 1);
</script>
</body></html>
