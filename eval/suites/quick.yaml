# A small, fast sample of the public suite: two practice sites, a warm explore, a warm request and two cold
# goal searches, with small budgets. Needs network.  python -m sitegraph eval eval/suites/quick.yaml
name: quick
defaults:
  navigators_per_site: 2
  policy:
    max_states: 25
    budget_s: 90
    max_depth: 3
tasks:
- id: books-explore
  site: https://books.toscrape.com/
  request: explore the site
  max_seconds: 300
  checks:
  - result: kind == explore
  - result: states >= 10
- id: books-travel
  site: https://books.toscrape.com/
  setup:
  - explore the site
  request: take me to the Travel category
  max_seconds: 300
  checks:
  - result: status == done
  - url_matches: category/books/travel
- id: books-price-cold
  site: https://books.toscrape.com/
  request: What is the price of A Light in the Attic?
  max_seconds: 300
  max_tokens: 60000
  checks:
  - answer_contains_any:
    - '51.77'
  - result: goal_explore.found == true
  - result: states <= 40
- id: quotes-author-cold
  site: https://quotes.toscrape.com/
  request: open the about page of Albert Einstein
  max_seconds: 300
  max_tokens: 60000
  checks:
  - url_matches: author/Albert-Einstein
  - result: goal_explore.found == true
  - result: states <= 40
